name: Pobierz aktywnosci

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run fetch_activities.js
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_PERSONAL_ATHLETE_ID: ${{ secrets.STRAVA_PERSONAL_ATHLETE_ID }}
          STRAVA_PERSONAL_REFRESH_TOKEN: ${{ secrets.STRAVA_PERSONAL_REFRESH_TOKEN }}
        run: |
          node scripts/fetch_activities.js

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git commit -m "Update activities data" || echo "No changes"

          git push

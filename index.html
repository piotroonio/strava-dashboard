<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Strava Cycling Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    h1 { margin-bottom: 10px; }

    .description {
      color: #555;
      margin-bottom: 20px;
    }

    input, select {
      margin: 10px 10px 20px 0;
      padding: 6px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #f5f5f5;
      cursor: pointer;
    }

    th span {
      margin-left: 5px;
      font-size: 12px;
      color: #999;
    }

    tr:hover {
      background: #fafafa;
    }

    .gold { background-color: #fff8dc; font-weight: bold; }
    .silver { background-color: #f0f0f0; font-weight: bold; }
    .bronze { background-color: #fbe5d6; font-weight: bold; }

    .highlight {
      background-color: #fff3e0;
    }

    a {
      color: #fc4c02;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* leader */
    .leader-card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff3e0;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .leader-card img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    .leader-name {
      font-weight: bold;
      font-size: 18px;
    }

    .leader-stats {
      font-size: 14px;
      color: #555;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: gray;
      text-align: center;
    }
  </style>
</head>

<body>

<h1>🚴 Zestawienie aktywności</h1>

<p class="description">
  Ranking na podstawie aktywności Strava
</p>

<input type="text" id="searchUser" placeholder="Szukaj użytkownika..." />

<select id="activityFilter">
  <option value="all">Wszystkie</option>
  <option value="Ride">Road</option>
  <option value="MountainBikeRide">MTB</option>
  <option value="GravelRide">Gravel</option>
</select>

<div id="leader" class="leader-card"></div>

<table id="table">
  <thead>
    <tr>
      <th>👤</th>
      <th data-sort="position"># <span></span></th>
      <th data-sort="name">Użytkownik <span></span></th>
      <th data-sort="totalDistance">Dystans <span></span></th>
      <th data-sort="avgSpeed">Prędkość <span></span></th>
      <th data-sort="avgElevation">Śr. przewyższenie <span></span></th>
      <th data-sort="totalElevation">Suma przewyższeń <span></span></th>
      <th data-sort="count">Aktywności <span></span></th>
      <th>Typy</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

let currentSort = "totalDistance";
let sortAsc = false;

// ✅ normalize
function normalize(text) {
  return text.toLowerCase();
}

// ✅ sort arrows
function updateSortIndicators() {
  document.querySelectorAll("th").forEach(th => {
    const key = th.dataset.sort;
    const span = th.querySelector("span");

    if (!span) return;

    if (key === currentSort) {
      span.textContent = sortAsc ? "↑" : "↓";
    } else {
      span.textContent = "";
    }
  });
}

fetch("./data.json")
  .then(res => res.json())
  .then(data => {

    let users = Array.isArray(data) ? data : data.users || [];

    // ✅ TEST USERS (do testów)
    users = users.concat([
      { name:"Anna", athleteId:1, avatar:"https://randomuser.me/api/portraits/women/1.jpg", totalDistance:800, avgSpeed:27, avgElevation:300, totalElevation:8000, count:20, activityTypes:["Ride"] },
      { name:"Jan", athleteId:2, avatar:"https://randomuser.me/api/portraits/men/2.jpg", totalDistance:1500, avgSpeed:30, avgElevation:250, totalElevation:12000, count:40, activityTypes:["Ride","GravelRide"] },
      { name:"MTB Rider", athleteId:3, avatar:"https://randomuser.me/api/portraits/men/3.jpg", totalDistance:600, avgSpeed:23, avgElevation:500, totalElevation:9000, count:18, activityTypes:["MountainBikeRide"] },
      { name:"Test Zero", athleteId:4, avatar:"", totalDistance:0, avgSpeed:0, avgElevation:0, totalElevation:0, count:0, activityTypes:[] }
    ]);

    const tbody = document.querySelector("#table tbody");
    const searchInput = document.getElementById("searchUser");
    const activityFilter = document.getElementById("activityFilter");

    function renderLeader(list) {
      if (!list.length) return;

      const leader = [...list].sort((a,b)=>b.totalDistance-a.totalDistance)[0];

      document.getElementById("leader").innerHTML = `
        <img src="${leader.avatar || 'https://via.placeholder.com/60er-name">🥇 ${leader.name}</div>
          <div class="leader-stats">
            ${leader.totalDistance} km • ${leader.avgSpeed} km/h • ${leader.count} aktywności
          </div>
        </div>
      `;
    }

    function renderTable(list) {
      const safeList = [...list];

      tbody.innerHTML = "";

      safeList.sort((a,b)=>{
        let A = a[currentSort];
        let B = b[currentSort];

        if (currentSort === "position") {
          A = a.totalDistance;
          B = b.totalDistance;
        }

        if (typeof A === "string") {
          A = A.toLowerCase();
          B = B.toLowerCase();
        }

        if (A < B) return sortAsc ? -1 : 1;
        if (A > B) return sortAsc ? 1 : -1;
        return 0;
      });

      safeList.forEach((u,i)=>{

        const cls = i===0 ? "gold" : i===1 ? "silver" : i===2 ? "bronze" : "";
        const pos = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : i+1;

        const row = `
          <tr class="${cls}">
            <td>
              ${u.avatar ? `<img src="${u.avatar}" class     </td>
            <td class="${currentSort==='position'?'highlight':''}">${pos}</td>
            <td class="${currentSort==='name'?'highlight':''}">
              ${u.athleteId ? `<a href="https://www.strava.com/athletes/${u.athleteId}" targetu.name}
            </td>
            <td class="${currentSort==='totalDistance'?'highlight':''}">${u.totalDistance}</td>
            <td class="${currentSort==='avgSpeed'?'highlight':''}">${u.avgSpeed}</td>
            <td class="${currentSort==='avgElevation'?'highlight':''}">${u.avgElevation}</td>
            <td class="${currentSort==='totalElevation'?'highlight':''}">${u.totalElevation}</td>
            <td class="${currentSort==='count'?'highlight':''}">${u.count}</td>
            <td>${(u.activityTypes||[]).join(", ")}</td>
          </tr>
        `;

        tbody.innerHTML += row;
      });

      updateSortIndicators();
    }

    function applyFilters() {
      const name = normalize(searchInput.value);
      const type = activityFilter.value;

      let filtered = users.filter(u =>
        normalize(u.name).includes(name)
      );

      if (type !== "all") {
        filtered = filtered.filter(u =>
          (u.activityTypes || []).includes(type)
        );
      }

      renderTable(filtered);
      renderLeader(filtered);
    }

    searchInput.addEventListener("input", applyFilters);
    activityFilter.addEventListener("change", applyFilters);

    document.querySelectorAll("th").forEach(th=>{
      th.addEventListener("click", ()=>{
        const key = th.dataset.sort;
        if (!key) return;

        if (currentSort === key) {
          sortAsc = !sortAsc;
        } else {
          currentSort = key;
          sortAsc = false;
        }

        applyFilters();
      });
    });

    applyFilters(); // ✅ start

  });

</script>

</body>
</html>

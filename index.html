<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Strava Cycling Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    input, select {
      margin: 10px 10px 20px 0;
      padding: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    th {
      cursor: pointer;
      background: #f5f5f5;
    }

    th span {
      margin-left: 5px;
      font-size: 12px;
      color: gray;
    }

    .gold { background: #fff8dc; }
    .silver { background: #f0f0f0; }
    .bronze { background: #fbe5d6; }

    .highlight { background: #fff3e0; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    a {
      color: #fc4c02;
      text-decoration: none;
    }

    .leader-card {
      display: flex;
      gap: 15px;
      padding: 15px;
      background: #fff3e0;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .leader-card img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    .leader-name {
      font-weight: bold;
      font-size: 18px;
    }

  </style>
</head>

<body>

<h1>🚴 Ranking Strava</h1>

<input id="searchUser" placeholder="Szukaj użytkownika">
<select id="activityFilter">
  <option value="all">Wszystkie</option>
  <option value="Ride">Road</option>
  <option value="MountainBikeRide">MTB</option>
  <option value="GravelRide">Gravel</option>
</select>

<div id="leader" class="leader-card"></div>

<table id="table">
  <thead>
    <tr>
      <th>👤</th>
      <th data-sort="position"># <span></span></th>
      <th data-sort="name">Użytkownik <span></span></th>
      <th data-sort="totalDistance">Dystans <span></span></th>
      <th data-sort="avgSpeed">Prędkość <span></span></th>
      <th data-sort="avgElevation">Śr. przewyższenie <span></span></th>
      <th data-sort="totalElevation">Suma przewyższeń <span></span></th>
      <th data-sort="count">Aktywności <span></span></th>
      <th>Typy</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

let currentSort = "totalDistance";
let sortAsc = false;

function normalize(text) {
  return text.toLowerCase();
}

function updateSortIndicators() {
  document.querySelectorAll("th").forEach(th => {
    const key = th.dataset.sort;
    const span = th.querySelector("span");

    if (!span) return;

    span.textContent = key === currentSort
      ? (sortAsc ? "↑" : "↓")
      : "";
  });
}

fetch("./data.json")
.then(r => r.json())
.then(data => {

  let users = Array.isArray(data) ? data : data.users || [];

  // TEST DATA
  users = users.concat([
    {name:"Anna", athleteId:1, avatar:"https://randomuser.me/api/portraits/women/1.jpg", totalDistance:800, avgSpeed:27, avgElevation:300, totalElevation:8000, count:20, activityTypes:["Ride"]},
    {name:"Jan", athleteId:2, avatar:"https://randomuser.me/api/portraits/men/2.jpg", totalDistance:1500, avgSpeed:30, avgElevation:250, totalElevation:12000, count:40, activityTypes:["GravelRide"]},
    {name:"MTB Rider", athleteId:3, avatar:"https://randomuser.me/api/portraits/men/3.jpg", totalDistance:600, avgSpeed:23, avgElevation:500, totalElevation:9000, count:18, activityTypes:["MountainBikeRide"]},
    {name:"Test Zero", athleteId:4, avatar:"", totalDistance:0, avgSpeed:0, avgElevation:0, totalElevation:0, count:0, activityTypes:[]}
  ]);

  const tbody = document.querySelector("#table tbody");
  const search = document.getElementById("searchUser");
  const filter = document.getElementById("activityFilter");

  function renderLeader(list) {
    if (!list.length) return;

    const leader = [...list].sort((a,b)=>b.totalDistance-a.totalDistance)[0];

    document.getElementById("leader").innerHTML = `
      <img src="${leader.avatar || 'https://via.placeholder.com/-name">🥇 ${leader.name}</div>
        <div>${leader.totalDistance} km • ${leader.avgSpeed} km/h</div>
      </div>
    `;
  }

  function renderTable(list) {
    const rows = [...list];

    tbody.innerHTML = "";

    rows.sort((a,b)=>{
      let A = currentSort === "position" ? a.totalDistance : a[currentSort];
      let B = currentSort === "position" ? b.totalDistance : b[currentSort];

      if (typeof A === "string") {
        A = A.toLowerCase();
        B = B.toLowerCase();
      }

      return sortAsc ? A - B : B - A;
    });

    rows.forEach((u,i)=>{

      const cls = i===0 ? "gold" : i===1 ? "silver" : i===2 ? "bronze" : "";
      const pos = ["🥇","🥈","🥉"][i] || (i+1);

      const row = `
        <tr class="${cls}">
          <td>${u.avatar ? `<img src="${u.avatar}"td>
          <td>${pos}</td>
          <td>
            ${u.athleteId ? `<a href="https://www.strava.com/athletes/${u.athleteId}" target="_blank">${u.name}</a>
          </td>
          <td>${u.totalDistance}</td>
          <td>${u.avgSpeed}</td>
          <td>${u.avgElevation}</td>
          <td>${u.totalElevation}</td>
          <td>${u.count}</td>
          <td>${(u.activityTypes||[]).join(", ")}</td>
        </tr>
      `;

      tbody.innerHTML += row;
    });

    updateSortIndicators();
  }

  function applyFilters() {
    let list = users.filter(u =>
      normalize(u.name).includes(normalize(search.value))
    );

    if (filter.value !== "all") {
      list = list.filter(u =>
        (u.activityTypes || []).includes(filter.value)
      );
    }

    renderTable(list);
    renderLeader(list);
  }

  search.addEventListener("input", applyFilters);
  filter.addEventListener("change", applyFilters);

  document.querySelectorAll("th").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.dataset.sort;
      if (!key) return;

      if (currentSort === key) sortAsc = !sortAsc;
      else {
        currentSort = key;
        sortAsc = false;
      }

      applyFilters();
    });
  });

  applyFilters();
});

</script>
</body>
</html>

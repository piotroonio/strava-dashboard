<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Strava Cycling Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    h1 { margin-bottom: 10px; }

    .description {
      color: #555;
      margin-bottom: 20px;
    }

    input {
      margin: 10px 0 20px 10px;
      padding: 6px;
      width: 220px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

th span {
  margin-left: 5px;
  font-size: 12px;
  color: #999;
}

    th {
      background-color: #f5f5f5;
      cursor: pointer;
    }

    tr:hover {
      background: #fafafa;
    }

    .gold { background-color: #fff8dc; font-weight: bold; }
    .silver { background-color: #f0f0f0; font-weight: bold; }
    .bronze { background-color: #fbe5d6; font-weight: bold; }

    a {
      color: #fc4c02;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .summary { margin-top: 20px; }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: gray;
      text-align: center;
    }

    
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}

  </style>
</head>

<body>

<h1>🚴 Zestawienie aktywności (maj–wrzesień)</h1>

<p class="description">
  Ranking na podstawie aktywności rowerowych ze Strava.
</p>

<label><b>Szukaj użytkownika:</b></label>
<input type="text" id="searchUser" placeholder="np. Piotr" />

<select id="activityFilter">
  <option value="all">Wszystkie</option>
  <option value="Ride">Road</option>
  <option value="MountainBikeRide">MTB</option>
  <option value="GravelRide">Gravel</option>
</select>


<table id="table">
  <thead>
    <tr>
      <th>👤</th>
      <th data-sort="position">#</th>
      <th data-sort="name">Użytkownik</th>
      <th data-sort="totalDistance">Dystans (km) <span></span></th>
      <th data-sort="avgSpeed">Śr. prędkość <span></span></th>
      <th data-sort="avgElevation">Śr. przewyższenie <span></span></th>
      <th data-sort="totalElevation">Suma przewyższeń <span></span></th>
      <th data-sort="count">Aktywności <span></span></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="summary" class="summary"></div>

<footer>
  <p>Powered by https://www.strava.com</p>
  <p>This application uses the Strava API but is not endorsed by Strava.</p>
</footer>

<script>

// ===== CONFIG SORT =====
let currentSort = "totalDistance";
let sortAsc = false;

// ===== TIME AGO =====
function timeAgo(dateString) {
  if (!dateString) return "brak danych";

  const now = new Date();
  const past = new Date(dateString);
  const diff = Math.floor((now - past) / 1000);

  if (diff < 60) return `${diff} s`;
  const m = Math.floor(diff / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} h`;
  return `${Math.floor(h / 24)} d`;
}

// ===== NORMALIZE =====
function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[ąćęłńóśźż]/g, c => ({
      'ą':'a','ć':'c','ę':'e','ł':'l',
      'ń':'n','ó':'o','ś':'s','ź':'z','ż':'z'
    }[c]));
}


function updateSortIndicators() {
  document.querySelectorAll("th").forEach(th => {
    const key = th.dataset.sort;
    const span = th.querySelector("span");

    if (!span) return;

    if (key === currentSort) {
      span.textContent = sortAsc ? "↑" : "↓";
    } else {
      span.textContent = "";
    }
  });
}


fetch("./data.json")
  .then(res => res.json())
  .then(data => {

    //const users = Array.isArray(data) ? data : data.users || [];
    
let users = Array.isArray(data) ? data : data.users || [];

// ✅ DODAJ TESTOWYCH USERÓW
const testUsers = [
  {
    name: "Anna Kowalska",
    athleteId: 1111,
    avatar: "https://randomuser.me/api/portraits/women/1.jpg",
    activityTypes:["Ride"],
    totalDistance: 850,
    avgSpeed: 27,
    avgElevation: 320,
    totalElevation: 8000,
    count: 22
  },
  {
    name: "Jan Nowak",
    athleteId: 2222,
    avatar: "https://randomuser.me/api/portraits/men/2.jpg",
    activityTypes:["GravelRide"],
    totalDistance: 1200,
    avgSpeed: 29,
    avgElevation: 280,
    totalElevation: 9500,
    count: 30
  }
];

// ✅ połącz realnego usera z testowymi
users = users.concat(testUsers);

    const tbody = document.querySelector("#table tbody");
    const searchInput = document.getElementById("searchUser");
    const activityFilter = document.getElementById("activityFilter");

    function renderTable(list) {
      tbody.innerHTML = "";

      let totalDistance = 0;
      let totalActivities = 0;

      // 🔥 SORT
      list.sort((a, b) => {
        let A = a[currentSort];
        let B = b[currentSort];

        if (currentSort === "name") {
          A = A.toLowerCase();
          B = B.toLowerCase();
        }

        if (currentSort === "position") {
          A = a.totalDistance;
          B = b.totalDistance;
        }

        if (A < B) return sortAsc ? -1 : 1;
        if (A > B) return sortAsc ? 1 : -1;
        return 0;
      });

      list.forEach((u, i) => {

        totalDistance += u.totalDistance;
        totalActivities += u.count;

        let cls = "";
        if (i === 0) cls = "gold";
        else if (i === 1) cls = "silver";
        else if (i === 2) cls = "bronze";

        const pos =
          i === 0 ? "🥇" :
          i === 1 ? "🥈" :
          i === 2 ? "🥉" : i + 1;




const row = `
  <tr class="${cls}">
    <td>
      ${
        u.avatar
          ? `<img src="${u.avatar}" alt="${u.name}" class="avatar">`
          : "👤"
      }
    </td>

    <td class="${currentSort === 'position' ? 'highlight' : ''}">
      ${pos}
    </td>

    <td class="${currentSort === 'name' ? 'highlight' : ''}">
      ${
        u.athleteId
          ? `<a href="https://www.strava.com/athletes/${u.athleteId}" target="_blank">${u.name}</a>`
          : u.name
      }
    </td>

    <td class="${currentSort === 'totalDistance' ? 'highlight' : ''}">
      ${u.totalDistance || 0}
    </td>

    <td class="${currentSort === 'avgSpeed' ? 'highlight' : ''}">
      ${u.avgSpeed}
    </td>

    <td class="${currentSort === 'avgElevation' ? 'highlight' : ''}">
      ${u.avgElevation}
    </td>

    <td class="${currentSort === 'totalElevation' ? 'highlight' : ''}">
      ${u.totalElevation}
    </td>

    <td class="${currentSort === 'count' ? 'highlight' : ''}">
      ${u.count}
    </td>
  </tr>
`;


        tbody.innerHTML += row;
      });

      const updatedAt = Array.isArray(data)
        ? data[0]?.updatedAt
        : data.updatedAt;

      document.getElementById("summary").innerHTML = `
        <p>📊 ${totalDistance.toFixed(1)} km</p>
        <p>🚴 ${totalActivities} aktywności</p>
        <p>⏱️ ${timeAgo(updatedAt)}</p>
      `;
    }

    //renderTable(users);
    applyFilters();
    
    updateSortIndicators();

    // 🔍 SEARCH
    //searchInput.addEventListener("input", () => {
    //  const val = normalize(searchInput.value);

    //  const filtered = users.filter(u =>
    //    normalize(u.name).includes(val)
   //   );

   //   renderTable(filtered);
   // });

    
function applyFilters() {
  const val = normalize(searchInput.value);
  const selected = activityFilter.value;

  // ✅ filtr po nazwie
  let filtered = users.filter(u =>
    normalize(u.name).includes(val)
  );

  // ✅ filtr po typie aktywności
  if (selected !== "all") {
    filtered = filtered.filter(u =>
      (u.activityTypes || []).includes(selected)
    );
  }

  renderTable(filtered);
  renderLeader(filtered); // ✅ ważne
}

// ✅ podłączenie eventów
searchInput.addEventListener("input", applyFilters);
activityFilter.addEventListener("change", applyFilters);


    // 🔽 SORT CLICK
    document.querySelectorAll("th").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (!key) return;

        if (currentSort === key) {
          sortAsc = !sortAsc;
        } else {
          currentSort = key;
          sortAsc = false;
        }

        //renderTable(users);
        applyFilters();
        updateSortIndicators();
      });
    });

  });

</script>

</body>
</html>

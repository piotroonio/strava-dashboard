<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Strava Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    h1 { margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; }
    th { text-align: left; }
    tr:hover { background: #f5f5f5; }
  </style>
</head>
<body>

<h1>🚴 Zestawienie aktywności</h1>

<table id="table">
  <thead>
    <tr>
      <th>#</th>
      <th>Użytkownik</th>
      <th>Dystans (km)</th>
      <th>Śr. prędkość</th>
      <th>Śr. przewyższenie</th>
      <th>Aktywności</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h2>Podsumowanie</h2>
<div id="summary"></div>

<script>
fetch("./data.json")
  .then(res => res.json())
  .then(data => {
    // sort ranking
    data.sort((a, b) => b.totalDistance - a.totalDistance);

    const tbody = document.querySelector("#table tbody");
    let totalDistance = 0;
    let totalActivities = 0;

    data.forEach((u, i) => {
      totalDistance += u.totalDistance;
      totalActivities += u.count;

      const row = `
        <tr>
          <td>${i + 1}</td>
          <td>${u.name}</td>
          <td>${u.totalDistance}</td>
          <td>${u.avgSpeed}</td>
          <td>${u.avgElevation}</td>
          <td>${u.count}</td>
        </tr>
      `;

      tbody.innerHTML += row;
    });

    document.getElementById("summary").innerHTML = `
      <p>Łączny dystans: <b>${totalDistance.toFixed(1)} km</b></p>
      <p>Liczba aktywności: <b>${totalActivities}</b></p>
    `;
  });
</script>

</body>
</html>

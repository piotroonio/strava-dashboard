<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strava Activity Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,
body{
    margin:0;
    height:100%;
    font-family:Arial,sans-serif;
}

#header{
    padding:10px;
    background:#fc4c02;
    color:white;
}

#map{
    height:calc(100vh - 60px);
}

.photo-thumb{
    width:200px;
    border-radius:8px;
    cursor:pointer;
}

#lightbox{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.9);
    z-index:9999;
}

#lightbox img{
    max-width:95%;
    max-height:95%;
}

.photo-marker {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;

    border: 3px solid #ffffff;

    box-shadow:
        0 3px 10px rgba(0,0,0,.35);

    background: white;
}
    
.photo-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
    
.photo-thumb {
    width: 250px;
    cursor: pointer;
}

.leaflet-popup-content-wrapper {
    padding: 0;
}

.leaflet-popup-content {
    margin: 0;
}

.popup-photo {
    display: block;
    width: 220px;
    border-radius: 8px;
}

#closeLightbox {
    position: absolute;

    top: 20px;
    right: 20px;

    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.95);

    color: #333;

    font-size: 32px;
    font-weight: bold;

    cursor: pointer;

    z-index: 10000;

    box-shadow:
      0 2px 10px rgba(0,0,0,.3);
}

#closeLightbox:hover {
    background: white;
}

#lightboxImage {

    max-width: 95%;
    max-height: 95%;

    border: 2px solid white;

    border-radius: 8px;

    box-shadow:
        0 0 20px rgba(0,0,0,.5);
}
</style>
    
</head>

<body>

<div id="header">
    <h2 id="activityName">
        Ładowanie...
    </h2>
</div>

<div id="map"></div>

<div id="lightbox">

    <button id="closeLightbox">
        ×
    </button>

    <img id="lightboxImage">

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@mapbox/polyline"></script>
<script>
const map = L.map("map");

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenStreetMap"
  }
).addTo(map);

async function loadData() {

    const activity =
        await fetch(
            "data/activity-detail.json"
        ).then(r => r.json());

    const photos =
        await fetch(
            "data/activity-photos.json"
        ).then(r => r.json());

    const streams =
        await fetch(
            "data/activity-streams.json"
        ).then(r => r.json());

    document.getElementById(
        "activityName"
    ).textContent = activity.name;

    const timeData =
        streams.time.data;

    const latlngData =
        streams.latlng.data;

    const polylinePoints =
        polyline.decode(
            activity.map.summary_polyline
        );

    const route =
        polylinePoints.map(
            p => [p[0], p[1]]
        );

    const track = L.polyline(
        route,
        {
            color: "#fc4c02",
            weight: 5
        }
    ).addTo(map);

    map.fitBounds(
        track.getBounds()
    );

    const activityStart =
        new Date(
            activity.start_date
        );

    photos.forEach(photo => {

        let lat;
        let lon;

        /*
         * Zdjęcie posiada GPS
         */
        if (
            photo.location &&
            photo.location.length === 2
        ) {

            lat = photo.location[0];
            lon = photo.location[1];

        } else {

            /*
             * Zdjęcie bez GPS
             * Wyznaczamy pozycję na podstawie czasu
             */

            const photoTime =
                new Date(
                    photo.created_at
                );

            const elapsedSeconds =
                Math.floor(
                    (
                        photoTime -
                        activityStart
                    ) / 1000
                );

            let closestIndex = 0;
            let smallestDiff = Number.MAX_SAFE_INTEGER;

            timeData.forEach(
                (t, idx) => {

                    const diff =
                        Math.abs(
                            t -
                            elapsedSeconds
                        );

                    if (
                        diff <
                        smallestDiff
                    ) {

                        smallestDiff =
                            diff;

                        closestIndex =
                            idx;
                    }

                }
            );

            lat =
                latlngData[closestIndex][0];

            lon =
                latlngData[closestIndex][1];
        }

        const imageUrl =
            photo.urls["2048"];

        const photoIcon =
            L.divIcon({

                html: `
                    <div class="photo-marker">
                        ${imageUrl}
                    </div>
                `,

                className: "",
                iconSize: [50, 50],
                iconAnchor: [25, 25]

            });

        L.marker(
            [lat, lon],
            {
                icon: photoIcon
            }
        )
        .addTo(map)
        .bindPopup(`
            ${imageUrl}"
            >
        `);

    });

}

function showPhoto(url){

    document.getElementById("lightboxImage").src = url;

    document.getElementById(
        "lightbox"
    ).style.display = "flex";
}

document
.getElementById("lightbox")
.addEventListener(
    "click",
    () => {
        document.getElementById(
            "lightbox"
        ).style.display = "none";
    }
);

document
    .getElementById("closeLightbox")
    .addEventListener(
        "click",
        (e) => {

            e.stopPropagation();

            document
                .getElementById("lightbox")
                .style.display = "none";

        }
    );
    
document.addEventListener(
    "keydown",
    (e) => {

        if (e.key === "Escape") {

            document
                .getElementById("lightbox")
                .style.display = "none";

        }

    }
);



loadData();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strava Activity Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>
<script src="https://unpkg.com/@mapbox/polyline"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<style>

html,
body{
    margin:0;
    height:100%;
    font-family:Arial,sans-serif;
}

#header{
    padding:10px;
    background:#fc4c02;
    color:white;
}

#map{
    height:60vh;
}

#mapContainer {

    position: relative;
}

.photo-thumb{
    width:200px;
    border-radius:8px;
    cursor:pointer;
}

#lightbox{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.9);
    z-index:9999;
}

#lightbox img{
    max-width:95%;
    max-height:95%;
}

.photo-marker {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    overflow: hidden;

    border: 3px solid #ffffff;

    box-shadow:
        0 3px 10px rgba(0,0,0,.35);

    background: white;
}
    
.photo-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
    
.photo-thumb {
    width: 250px;
    cursor: pointer;
}

.leaflet-popup-content-wrapper {
    padding: 0;
}

.leaflet-popup-content {
    margin: 0;
}

.popup-photo {
    display: block;
    width: 220px;
    border-radius: 8px;
}

#closeLightbox {
    position: absolute;

    top: 20px;
    right: 20px;

    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.95);

    color: #333;

    font-size: 32px;
    font-weight: bold;

    cursor: pointer;

    z-index: 10000;

    box-shadow:
      0 2px 10px rgba(0,0,0,.3);
}

#closeLightbox:hover {
    background: white;
}

#lightboxImage {

    max-width: 95%;
    max-height: 95%;

    border: 2px solid white;

    border-radius: 8px;

    box-shadow:
        0 0 20px rgba(0,0,0,.5);
}

.start-marker {
    width: 20px;
    height: 20px;

    background: #2ecc71;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow: 0 2px 6px rgba(0,0,0,.3);
}

#activityStats {

    padding: 15px;

    background: #f8f8f8;

    border-bottom: 1px solid #ddd;
}

.stats-grid {

    display: flex;
    flex-wrap: wrap;

    gap: 20px;
}

.stat-card {

    background: white;

    padding: 12px;

    border-radius: 8px;

    box-shadow:
        0 2px 5px rgba(0,0,0,.1);

    min-width: 120px;
}

.stat-value {

    font-size: 20px;
    font-weight: bold;
}

.stat-label {

    color: #666;
    font-size: 12px;
}

#gallery {

    display: flex;
    flex-wrap: wrap;

    gap: 10px;

    padding: 15px;
}

.gallery-photo {

    width: 220px;
    height: 220px;

    object-fit: cover;

    border-radius: 8px;

    cursor: pointer;

    transition: .2s;
}

.gallery-photo:hover {

    transform: scale(1.03);
}

.nav-button {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 60px;
    height: 60px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.9);

    color: #333;

    font-size: 32px;
    font-weight: bold;

    cursor: pointer;

    z-index: 10000;

    box-shadow:
        0 2px 10px rgba(0,0,0,.3);
}

.nav-button:hover {

    background: white;
}

#prevPhoto {

    left: 20px;
}

#nextPhoto {

    right: 20px;
}

#photoCounter {

    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,.7);

    color: white;

    padding: 8px 16px;

    border-radius: 20px;

    font-size: 16px;
    font-weight: bold;

    z-index: 10000;
}

.location-card {

    min-width: 240px;
}

.location-card .stat-value {

    font-size: 15px;
    line-height: 1.4;
}

.popup-container {

    position: relative;
}

.popup-close {

    position: absolute;

    top: 6px;
    right: 6px;

    width: 24px;
    height: 24px;

    border-radius: 50%;

    border: none;

    background: white;

    color: red;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 1px 4px rgba(0,0,0,.3);

    line-height: 24px;

    padding: 0;
}

.route-marker {

    width: 18px;
    height: 18px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid white;

    box-shadow:
        0 2px 6px rgba(0,0,0,.35);

    font-size: 10px;
    font-weight: bold;
}

.start-marker {

    background: #2ecc71;
    color: white;
}

.finish-marker {

    background: #ffffff;
    color: black;
}

#fullscreenMapBtn {

    position: absolute;

    bottom: 15px;
    right: 15px;

    z-index: 2000;

    width: 44px;
    height: 44px;

    border: none;
    border-radius: 50%;

    background: white;

    color: #333;

    font-size: 22px;

    cursor: pointer;

    box-shadow:
        0 2px 8px rgba(0,0,0,.3);
}


#fullscreenMapBtn:hover {

    background: #f5f5f5;
}

.map-fullscreen {

    position: fixed !important;

    inset: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    z-index: 5000;

    background: white;
}

.map-fullscreen #map {

    height: 100vh !important;
}

.map-fullscreen + #fullscreenMapBtn {

    position: fixed;

    right: 15px;
    bottom: 15px;

    z-index: 2001;
}

.weather-card {

    min-width: 220px;
}

.weather-card .stat-value {

    margin-bottom: 6px;
}

.weather-card .stat-label {

    margin-top: 2px;
}

</style>
</head>

<body>

<div id="header">
    <h2 id="activityName">
        Ładowanie...
    </h2>
</div>

<div id="mapContainer">
    <div id="map"></div>
        <button id="fullscreenMapBtn">
        ⛶
        </button>
</div>

<div id="activityStats"></div>

<div id="gallery"></div>

<div id="lightbox">

    <button id="closeLightbox">
        ×
    </button>

    <button id="prevPhoto" class="nav-button">
        ❮
    </button>

    <img id="lightboxImage">

    <button id="nextPhoto" class="nav-button">
        ❯
    </button>
    <div id="photoCounter"></div>
</div>

<script>

const map = L.map("map");
    
const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenStreetMap"
  }
);

const topo = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenTopoMap"
  }
);

const esriStreet = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {
    attribution: "Tiles © Esri"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    attribution: "Tiles © Esri"
  }
);

osm.addTo(map);

L.control.layers(
  {
    "OSM": osm,
    "Topo": topo,
    "Esri Street": esriStreet,
    "Satellite": satellite
  }
).addTo(map);

L.control.scale({
    metric: true,
    imperial: false,
    position: "bottomleft"
}).addTo(map);

L.Control.geocoder({
    defaultMarkGeocode: true
})
.addTo(map);

function formatDuration(
    seconds
) {

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    return `${hours}h ${minutes}min`;
}

let galleryImages = [];
let currentImageIndex = 0;

function updatePhotoCounter() {

    document.getElementById(
        "photoCounter"
    ).textContent =
        `${currentImageIndex + 1} / ${galleryImages.length}`;
}

function showPhoto(url) {

    document.getElementById(
        "lightboxImage"
    ).src = url;

    document.getElementById(
        "lightbox"
    ).style.display = "flex";
}

function showPhotoByIndex(
    index
) {

    currentImageIndex = index;

    showPhoto(
        galleryImages[
            currentImageIndex
        ]
    );
}

function showNextPhoto() {

    if (
        galleryImages.length === 0
    ) {
        return;
    }

    currentImageIndex =
        (
            currentImageIndex + 1
        ) %
        galleryImages.length;

    showPhoto(
        galleryImages[
            currentImageIndex
        ]
    );
}

function showPreviousPhoto() {

    if (
        galleryImages.length === 0
    ) {
        return;
    }

    currentImageIndex =
        (
            currentImageIndex - 1 +
            galleryImages.length
        ) %
        galleryImages.length;

    showPhoto(
        galleryImages[
            currentImageIndex
        ]
    );
}

document
    .getElementById("prevPhoto")
    .addEventListener(
        "click",
        (e) => {

            e.stopPropagation();

            showPreviousPhoto();

        }
    );

document
    .getElementById("nextPhoto")
    .addEventListener(
        "click",
        (e) => {

            e.stopPropagation();

            showNextPhoto();

        }
    );
    
async function loadData() {
    const cacheBuster =
        Date.now();
    
    const activity =
        await fetch(
            "data/activity-detail.json?v=${cacheBuster}"
        ).then(r => r.json());

    const photos =
        await fetch(
            "data/activity-photos.json?v=${cacheBuster}"
        ).then(r => r.json());

    const streams =
        await fetch(
            "data/activity-streams.json?v=${cacheBuster}"
        ).then(r => r.json());

    document.getElementById(
        "activityName"
    ).textContent = activity.name;

const avgSpeed =
    activity.average_speed
        ? activity.average_speed * 3.6
        : (
            activity.distance /
            activity.moving_time
          ) * 3.6;

const maxSpeed =
    activity.max_speed
        ? activity.max_speed * 3.6
        : 0;    
const activityDate =
    new Date(
        activity.start_date
    );

const formattedDate =
    activityDate.toLocaleString(
        "pl-PL",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
    
const startLocation =
    [
        activity.start_location?.city,
        activity.start_location?.road
    ]
    .filter(Boolean)
    .join(", ul. ");

const finishLocation =
    [
        activity.finish_location?.city,
        activity.finish_location?.road
    ]
    .filter(Boolean)
    .join(", ul. ");

const startAddress =
    activity.start_location?.display_name || "";

const finishAddress =
    activity.finish_location?.display_name || "";

const startAltitude =
    activity.start_altitude ?? "-";

const finishAltitude =
    activity.finish_altitude ?? "-";

function windArrow(
    degrees
) {

    return `
        <span
            style="
                display:inline-block;
                transform:rotate(${degrees + 180}deg);
                color:#1e88e5;
                font-size:20px;
                font-weight:bold;
            "
        >
            ➤
        </span>
    `;
}
    
const windIcon =
    windArrow(
        activity.weather.wind_direction
    );
    
document.getElementById(
    "activityStats"
).innerHTML = `


<div class="stats-grid">

    <div class="stat-card">
            <div class="stat-value">
                ${formattedDate}
            </div>
        <div class="stat-label">
            start aktywności
        </div>
    </div>
    
    <div class="stat-card location-card" title="${startAddress}">
        <div class="stat-value">
            ${startLocation}
        </div>
        <div class="stat-label">
            start
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-value">
            ${startAltitude} m
        </div>
        <div class="stat-label">
            🏔️ wysokość startu
        </div>
    </div>

    <div class="stat-card weather-card">
        <div class="stat-value">
            🌡️ ${activity.weather.temperature.toFixed(1)}°C
        </div>

        <div class="stat-label">
            odczuwalna:
            ${activity.weather.feels_like.toFixed(1)}°C
        </div>

        <div class="stat-label">
            💨 wiatr:
            ${activity.weather.wind_speed.toFixed(1)} km/h
            ${windIcon}
        </div>

        <div class="stat-label">
            ☁️ zachmurzenie:
            ${activity.weather.cloud_cover}%
        </div>

        <div class="stat-label">
            🌧 opady:
            ${activity.weather.precipitation} mm
        </div>
    </div>

    <div class="stat-card location-card" title="${finishAddress}">
        <div class="stat-value">
            ${finishLocation}
        </div>
        <div class="stat-label">
            koniec
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-value">
            ${finishAltitude} m
        </div>
        <div class="stat-label">
            🏁 wysokość mety
        </div>
    </div>

        <div class="stat-card">
        
            <div class="stat-value">
                ${(activity.distance / 1000).toFixed(1)}
            </div>
            <div class="stat-label">
                km
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-value">
                ${Math.round(
                    activity.total_elevation_gain
                )}
            </div>
            <div class="stat-label">
                m przewyższenia
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-value">
                ${formatDuration(
                    activity.moving_time
                )}
            </div>
            <div class="stat-label">
                czas ruchu
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-value">
                ${avgSpeed.toFixed(1)}
            </div>
            <div class="stat-label">
                km/h śr.
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-value">
                ${maxSpeed.toFixed(1)}
            </div>
            <div class="stat-label">
                km/h max
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-value">
                ${photos.length}
            </div>
            <div class="stat-label">
                zdjęć
            </div>
        </div>

    </div>
`;

    const timeData =
        streams.time.data;

    const latlngData =
        streams.latlng.data;

    let route;

    if (
        streams.latlng &&
        streams.latlng.data
    ) {

        route =
            streams.latlng.data.map(
                p => [p[0], p[1]]
            );

    } else {

        route =
            polyline.decode(
                activity.map.summary_polyline
            )
            .map(
                p => [p[0], p[1]]
            );
    }

    const track = L.polyline(
        route,
        {
            color: "#fc4c02",
            weight: 4
        }
    ).addTo(map);

    L.polylineDecorator(
    track,
    {
        patterns: [
            {
                offset: 25,
                repeat: 200,
                symbol: L.Symbol.arrowHead({
                    pixelSize: 10,
                    polygon: false,
                    pathOptions: {
                        color: "#fc4c02",
                        weight: 3
                    }
                })
            }
        ]
    }
).addTo(map);
    
    map.fitBounds(
        track.getBounds()
    );

const startIcon = L.divIcon({
    html: `<div class="route-marker start-marker">s</div>`,
    className: "",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
});

const finishIcon = L.divIcon({
    html: `<div class="route-marker finish-marker">m</div>`,
    className: "",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
});

L.marker(
    route[0],
    { icon: startIcon }
).addTo(map);

L.marker(
    route[route.length - 1],
    { icon: finishIcon }
).addTo(map);
    
    const activityStart =
        new Date(
            activity.start_date
        );

    photos.forEach(photo => {

        let lat;
        let lon;

        /*
         * Zdjęcie posiada GPS
         */
        if (
            photo.location &&
            photo.location.length === 2
        ) {

            lat = photo.location[0];
            lon = photo.location[1];

        } else {

            /*
             * Zdjęcie bez GPS
             * Wyznaczamy pozycję na podstawie czasu
             */

            const photoTime =
                new Date(
                    photo.created_at
                );

            const elapsedSeconds =
                Math.floor(
                    (
                        photoTime -
                        activityStart
                    ) / 1000
                );

            let closestIndex = 0;
            let smallestDiff = Number.MAX_SAFE_INTEGER;

            timeData.forEach(
                (t, idx) => {

                    const diff =
                        Math.abs(
                            t -
                            elapsedSeconds
                        );

                    if (
                        diff <
                        smallestDiff
                    ) {

                        smallestDiff =
                            diff;

                        closestIndex =
                            idx;
                    }

                }
            );

            lat =
                latlngData[closestIndex][0];

            lon =
                latlngData[closestIndex][1];
        }

        const imageUrl =
            photo.urls["2048"];

        const photoIcon =
            L.divIcon({

                html: `
                    <div class="photo-marker">
                      <img src="${imageUrl}">
                    </div>
                `,

                className: "",
                iconSize: [50, 50],
                iconAnchor: [25, 25]

            });

        L.marker(
            [lat, lon],
            {
                icon: photoIcon
            }
        )
        .addTo(map)    
        .bindPopup(`
        <div class="popup-container">
        <button class="popup-close" onclick="map.closePopup(); event.stopPropagation();">
            ×
        </button>
        <img src="${imageUrl}" class="popup-photo" onclick="showPhoto('${imageUrl}')">
        </div>
                `,    
                {
                closeButton: false
                }
                );

    });

galleryImages =
    photos.map(
        photo =>
            photo.urls["2048"]
    );

document.getElementById(
    "gallery"
).innerHTML =

    galleryImages
    .map(
        (
            imageUrl,
            index
        ) => `

            <img
                src="${imageUrl}"
                class="gallery-photo"
                onclick="showPhotoByIndex(${index})"
            >

        `
    )
    .join("");

}

function showPhoto(url){

    document.getElementById("lightboxImage").src = url;

    updatePhotoCounter();

    document.getElementById(
        "lightbox"
    ).style.display = "flex";
}

document
.getElementById("lightbox")
.addEventListener(
    "click",
    () => {
        document.getElementById(
            "lightbox"
        ).style.display = "none";
    }
);

document
    .getElementById("closeLightbox")
    .addEventListener(
        "click",
        (e) => {

            e.stopPropagation();

            document
                .getElementById("lightbox")
                .style.display = "none";

        }
    );
    
document.addEventListener(
    "keydown",
    (e) => {

        const lightbox =
            document.getElementById(
                "lightbox"
            );

        const mapContainer =
            document.getElementById(
                "mapContainer"
            );

        const fullscreenBtn =
            document.getElementById(
                "fullscreenMapBtn"
            );

        const lightboxVisible =
            lightbox.style.display ===
            "flex";

        /*
         * ESC - najpierw zamknij zdjęcie
         */
        if (
            e.key === "Escape" &&
            lightboxVisible
        ) {

            lightbox.style.display =
                "none";

            return;
        }

        /*
         * ESC - wyjdź z pełnego ekranu mapy
         */
        if (
            e.key === "Escape" &&
            mapContainer.classList.contains(
                "map-fullscreen"
            )
        ) {

            mapContainer.classList.remove(
                "map-fullscreen"
            );

            fullscreenBtn.innerHTML =
                "⛶";

            setTimeout(
                () => {
                    map.invalidateSize();
                },
                150
            );

            return;
        }

        /*
         * Strzałki działają tylko dla galerii
         */
        if (!lightboxVisible) {
            return;
        }

        if (
            e.key === "ArrowRight"
        ) {

            showNextPhoto();
        }

        if (
            e.key === "ArrowLeft"
        ) {

            showPreviousPhoto();
        }

    }
);

const fullscreenBtn =
    document.getElementById(
        "fullscreenMapBtn"
    );

fullscreenBtn.addEventListener(
    "click",
    () => {

        const mapDiv =
            document.getElementById(
                "mapContainer"
            );

        const isFullscreen =
            mapDiv.classList.toggle(
                "map-fullscreen"
            );

        fullscreenBtn.innerHTML =
            isFullscreen
                ? "✕"
                : "⛶";

        setTimeout(
            () => {
                map.invalidateSize();
            },
            150
        );

    }
);

loadData();

</script>

</body>
</html>

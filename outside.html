<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Aktywności poza Wrocławiem</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f5f5f5;
    }

    tr:hover {
      background: #fafafa;
    }

    a {
      color: #fc4c02;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>

</head>
<body>

<h1>🚴 Aktywności poza Wrocławiem</h1>

<table>
  <thead>
    <tr>
      <th>Użytkownik</th>
      <th>Data</th>
      <th>Lokalizacja</th>
      <th>Dystans (km)</th>
      <th>Strava</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

function formatDate(dateString) {
  const d = new Date(dateString);

  const day = String(d.getDate()).padStart(2, "0");
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const year = d.getFullYear();

  return `${day}-${month}-${year}`;
}
  
fetch("./outside.json")
  .then(r => r.json())
  .then(data => {

    // ✅ SORTOWANIE PO DACIE: b - a → malejąco (najnowsze na górze) ✅ a - b → rosnąco
    data.sort((a, b) => new Date(b.date) - new Date(a.date));

    const tbody = document.getElementById("table");

    data.forEach(a => {

      //const distance = (a.distance / 1000).toFixed(1);

      const row = `
        <tr>
          <td>${a.name}</td>
          <td>${formatDate(a.date)}</td>
          <td>${a.location || "-"}</td>
          <td>${a.distance}</td>
          <td>
            <a href="${a.link}" target="_blank">...</a>
          </td>
        </tr>
      `;

      tbody.innerHTML += row;
    });

  })
  .catch(err => {
    document.body.innerHTML += "<p>Błąd ładowania danych</p>";
    console.error(err);
  });

</script>

</body>
</html>

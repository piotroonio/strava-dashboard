<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Activity Explorer</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,
body{
    margin:0;
    height:100%;
    font-family:Arial,sans-serif;
}

#toolbar{

    display:flex;
    gap:10px;
    align-items:center;

    padding:10px;

    background:#fc4c02;
    color:white;
}

#toolbar input,
#toolbar button{

    padding:6px;
    font-size:14px;
}

#toolbar button{

    cursor:pointer;
    border:none;

    background:white;
    color:#fc4c02;

    border-radius:4px;
    font-weight:bold;
}

#map{

    height:70vh;
}

#activityPanel{

    padding:15px;
}

#activityTitle{

    margin-top:0;
}

.stat{

    margin-bottom:5px;
}

</style>

</head>

<body>

<div id="toolbar">

    <label>
        Od:
        <input
            type="date"
            id="fromDate">
    </label>

    <label>
        Do:
        <input
            type="date"
            id="toDate">
    </label>

    <button id="showBtn">
        Pokaż aktywności
    </button>

</div>

<div id="map"></div>

<div id="activityPanel">

    <h2 id="activityTitle">
        Wybierz aktywność na mapie
    </h2>

    <div id="activityInfo"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map =
    L.map("map");

const topo =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "© OpenTopoMap"
        }
    );

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "© OpenStreetMap"
        }
    );

topo.addTo(map);

L.control.layers({

    "OpenTopoMap": topo,
    "OpenStreetMap": osm

}).addTo(map);

let tracks = [];

async function loadActivities(){

    return await fetch(
        "data/activities.json"
    )
    .then(
        r => r.json()
    );
}

function clearTracks(){

    tracks.forEach(
        track => map.removeLayer(track)
    );

    tracks = [];
}

async function showActivities(){

    clearTracks();

    const activities =
        await loadActivities();

    const fromDate =
        new Date(
            document
                .getElementById(
                    "fromDate"
                )
                .value
        );

    const toDate =
        new Date(
            document
                .getElementById(
                    "toDate"
                )
                .value
        );

    const filtered =
        activities.filter(
            activity => {

                const date =
                    new Date(
                        activity.start_date
                    );

                return (
                    date >= fromDate &&
                    date <= toDate
                );

            }
        );

    const bounds = [];

    for (
        const activity
        of filtered
    ){

        try{

            const streams =
                await fetch(
                    `data/activities/${activity.id}-streams.json`
                )
                .then(
                    r => r.json()
                );

            if(
                !streams.latlng ||
                !streams.latlng.data
            ){
                continue;
            }

            const route =
                streams.latlng.data.map(
                    p => [p[0], p[1]]
                );

            const track =
                L.polyline(
                    route,
                    {
                        color:"#fc4c02",
                        weight:3
                    }
                )
                .addTo(map);

            tracks.push(track);

            bounds.push(
                ...route
            );

            track.on(
                "click",
                () => showActivity(
                    activity.id
                )
            );

        }
        catch(err){

            console.error(
                activity.id,
                err
            );

        }

    }

    if(
        bounds.length > 0
    ){
        map.fitBounds(
            bounds
        );
    }

}

async function showActivity(
    activityId
){

    const detail =
        await fetch(
            `data/activities/${activityId}-detail.json`
        )
        .then(
            r => r.json()
        );

    document
        .getElementById(
            "activityTitle"
        )
        .textContent =
            detail.name;

    document
        .getElementById(
            "activityInfo"
        )
        .innerHTML = `

            <div class="stat">
                🚴 Dystans:
                ${(detail.distance / 1000).toFixed(1)} km
            </div>

            <div class="stat">
                ⛰ Przewyższenie:
                ${Math.round(detail.total_elevation_gain)} m
            </div>

            <div class="stat">
                🕒 Czas:
                ${Math.round(detail.moving_time / 60)} min
            </div>

            <div class="stat">
                📅 Data:
                ${new Date(detail.start_date)
                    .toLocaleString("pl-PL")}
            </div>

        `;
}

document
    .getElementById(
        "showBtn"
    )
    .addEventListener(
        "click",
        showActivities
    );

const today =
    new Date();

const monthAgo =
    new Date();

monthAgo.setMonth(
    monthAgo.getMonth() - 1
);

document
    .getElementById(
        "fromDate"
    )
    .value =
    monthAgo
        .toISOString()
        .slice(0,10);

document
    .getElementById(
        "toDate"
    )
    .value =
    today
        .toISOString()
        .slice(0,10);

</script>

</body>
</html>
